<!doctype html><meta charset="utf-8" /><title>h</title>
<script type="module">
  const job = new URLSearchParams(location.search).get("job");
  const log = (m) => fetch("/log", { method: "POST", body: String(m) });
  window.onerror = (m, s, l) => log("ERR " + m + " @" + s + ":" + l);
  try {
    const mod = await import("/" + job);
    const out = await mod.run();
    await fetch("/done", { method: "POST", body: JSON.stringify(out) });
  } catch (e) {
    await log("FAIL " + ((e && e.stack) || e));
    await fetch("/done", {
      method: "POST",
      body: JSON.stringify({ error: String((e && e.stack) || e) }),
    });
  }
</script>
